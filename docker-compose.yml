# =============================================================
# Comparateur de Prix Jumia CI — Docker Compose
# ENSEA — AS Data Science | Dr N'golo Konate
#
# Services :
#   postgres   → Base de données PostgreSQL
#   redis      → Broker Celery + cache
#   api        → API Flask
#   worker     → Celery worker (exécute les scrapes)
#   beat       → Celery Beat (planificateur périodique)
#   prometheus → Collecte des métriques
#   grafana    → Dashboard de monitoring
#   airflow-*  → Apache Airflow (orchestrateur visuel de pipeline)
# =============================================================

services:

  # ───────────────────────────────────────────
  # 1. PostgreSQL
  # ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: jumia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-jumia_db}
      POSTGRES_USER:     ${POSTGRES_USER:-jumia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jumia_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./airflow/init-airflow-db.sql:/docker-entrypoint-initdb.d/02_airflow.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jumia_user} -d ${POSTGRES_DB:-jumia_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────────────────────────────────────
  # 2. Redis
  # ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: jumia_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────────────────────────────────────
  # 3. API Flask
  # ───────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jumia_api
    restart: unless-stopped
    environment:
      DATABASE_URL:  postgresql://${POSTGRES_USER:-jumia_user}:${POSTGRES_PASSWORD:-jumia_pass}@postgres:5432/${POSTGRES_DB:-jumia_db}
      REDIS_URL:     redis://redis:6379/0
      SECRET_KEY:    ${SECRET_KEY:-dev-secret-change-in-production}
      FLASK_DEBUG:   "false"
      FLASK_ENV:     "production"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GROQ_TIMEOUT: ${GROQ_TIMEOUT:-30}
      PYTHONPATH:    /app
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app/api
      - ./scraper:/app/scraper
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ───────────────────────────────────────────
  # 4. FlareSolverr (bypass Cloudflare pour Jumia)
  # ───────────────────────────────────────────
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: jumia_flaresolverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
    ports:
      - "8191:8191"

  # ───────────────────────────────────────────
  # 5. Celery Worker
  # ───────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jumia_worker
    restart: unless-stopped
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jumia_user}:${POSTGRES_PASSWORD:-jumia_pass}@postgres:5432/${POSTGRES_DB:-jumia_db}
      REDIS_URL:       redis://redis:6379/0
      FLARESOLVERR_URL: http://flaresolverr:8191/v1
      GMAIL_USER:      ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      PYTHONPATH:      /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flaresolverr:
        condition: service_started
    volumes:
      - ./scraper:/app/scraper

  # ───────────────────────────────────────────
  # 5. Celery Beat (planificateur)
  # ───────────────────────────────────────────
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jumia_beat
    restart: unless-stopped
    command: celery -A tasks.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jumia_user}:${POSTGRES_PASSWORD:-jumia_pass}@postgres:5432/${POSTGRES_DB:-jumia_db}
      REDIS_URL:    redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ───────────────────────────────────────────
  # 6. Prometheus
  # ───────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: jumia_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api

  # ───────────────────────────────────────────
  # 7. Grafana
  # ───────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.0.0
    container_name: jumia_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # ───────────────────────────────────────────
  # 8. Airflow — Init (migration base + admin)
  # ───────────────────────────────────────────
  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: jumia_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username $${AIRFLOW_ADMIN_USER:-admin} \
          --password $${AIRFLOW_ADMIN_PASSWORD:-admin123} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@ensea.ed.ci || true
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-jumia_user}:${POSTGRES_PASSWORD:-jumia_pass}@postgres:5432/airflow_db
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-zTnBJnQrIjXqFpF9ZRqV_VZzOl7UaGnRaEqXpKm3bDQ=}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    depends_on:
      postgres:
        condition: service_healthy

  # ───────────────────────────────────────────
  # 9. Airflow — Webserver (interface DAGs)
  # ───────────────────────────────────────────
  airflow-webserver:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: jumia_airflow_webserver
    restart: unless-stopped
    command: airflow webserver --port 8080
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-jumia_user}:${POSTGRES_PASSWORD:-jumia_pass}@postgres:5432/airflow_db
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-zTnBJnQrIjXqFpF9ZRqV_VZzOl7UaGnRaEqXpKm3bDQ=}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags:ro
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # ───────────────────────────────────────────
  # 10. Airflow — Scheduler (execute les DAGs)
  # ───────────────────────────────────────────
  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: jumia_airflow_scheduler
    restart: unless-stopped
    command: airflow scheduler
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-jumia_user}:${POSTGRES_PASSWORD:-jumia_pass}@postgres:5432/airflow_db
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-zTnBJnQrIjXqFpF9ZRqV_VZzOl7UaGnRaEqXpKm3bDQ=}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./dags:/opt/airflow/dags:ro
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

# ───────────────────────────────────────────
# Volumes persistants
# ───────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data: