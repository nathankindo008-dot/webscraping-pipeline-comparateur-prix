{% extends "base.html" %}
{% block title %}Comparer{% endblock %}
{% block extra_css %}
<style>
.cmp-intro{text-align:center;margin-bottom:2rem}
.picker-row{display:grid;grid-template-columns:1fr auto 1fr;gap:1rem;align-items:start;margin-bottom:2rem}
.picker{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow);border:1px solid var(--border);padding:1.25rem;position:relative}
.picker .site-tag{display:inline-flex;align-items:center;gap:.3rem;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:.25rem .65rem;border-radius:20px;color:#fff;margin-bottom:.75rem}
.picker .site-tag.jumia{background:var(--orange)}
.picker .site-tag.djok{background:var(--purple)}
.picker .search-box{position:relative}
.picker .search-box input{width:100%;padding:.7rem 1rem .7rem 2.4rem;border:2px solid var(--border);border-radius:10px;font-size:.88rem;outline:none;font-family:inherit;transition:.15s}
.picker .search-box input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(246,139,30,.1)}
.picker .search-box .icon{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);font-size:.9rem;color:var(--muted);pointer-events:none}
.dropdown{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-xl);max-height:320px;overflow-y:auto;z-index:50;display:none}
.dropdown.show{display:block}
.dropdown .item{display:flex;align-items:center;gap:.75rem;padding:.65rem .85rem;cursor:pointer;transition:.1s;border-bottom:1px solid #f9fafb}
.dropdown .item:hover{background:var(--orange-bg)}
.dropdown .item.selected{background:var(--orange-bg);border-left:3px solid var(--orange)}
.dropdown .item img{width:44px;height:44px;object-fit:contain;border-radius:6px;background:var(--light);flex-shrink:0}
.dropdown .item .info{flex:1;min-width:0}
.dropdown .item .info .name{font-size:.8rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dropdown .item .info .price{font-size:.78rem;font-weight:700;color:var(--orange)}
.dropdown .item .info .cat{font-size:.65rem;color:var(--muted)}
.dropdown .empty{padding:1.5rem;text-align:center;color:var(--muted);font-size:.85rem}

.selected-card{margin-top:.75rem;display:none;background:var(--light);border:2px solid var(--orange);border-radius:var(--radius);padding:.75rem;position:relative}
.selected-card.show{display:flex;align-items:center;gap:.75rem}
.selected-card img{width:56px;height:56px;object-fit:contain;border-radius:8px;background:#fff;flex-shrink:0}
.selected-card .info{flex:1;min-width:0}
.selected-card .info .name{font-size:.82rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selected-card .info .price{font-size:.9rem;font-weight:800;color:var(--orange)}
.selected-card .info .cat{font-size:.65rem;color:var(--muted)}
.selected-card .remove{position:absolute;top:.4rem;right:.4rem;width:24px;height:24px;border-radius:6px;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.8rem;color:var(--muted);transition:.15s}
.selected-card .remove:hover{background:#fee2e2;color:var(--red);border-color:#fca5a5}

.vs-circle{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--orange-darker));color:#fff;font-size:.9rem;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(246,139,30,.3);align-self:center;flex-shrink:0}

.cmp-btn-row{text-align:center;margin-bottom:2rem}

.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}
.cmp-card{background:#fff;border:2px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;text-align:center;position:relative;transition:.3s}
.cmp-card:hover{box-shadow:var(--shadow-lg)}
.cmp-card.best{border-color:var(--green);box-shadow:0 0 0 3px rgba(16,185,129,.15)}
.best-tag{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;font-size:.65rem;font-weight:800;padding:.25rem .75rem;border-radius:20px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.cmp-card .badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:.6rem;font-weight:800;text-transform:uppercase;color:#fff;margin-bottom:.75rem}
.cmp-card .badge.jumia{background:var(--orange)}.cmp-card .badge.djok{background:var(--purple)}
.cmp-card img{width:120px;height:120px;object-fit:contain;margin:0 auto .75rem;display:block;border-radius:10px;background:var(--light)}
.cmp-card .name{font-size:.95rem;font-weight:700;min-height:2.5rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:.25rem}
.cmp-card .cat{font-size:.72rem;color:var(--muted);margin-bottom:.75rem}
.cmp-card .price{font-size:1.8rem;font-weight:900;margin-bottom:.2rem}
.cmp-card .old{font-size:.88rem;color:var(--muted);text-decoration:line-through}
.cmp-card .disc{display:inline-block;background:#fef2f2;color:var(--red);font-size:.75rem;font-weight:700;padding:.25rem .6rem;border-radius:5px;margin-top:.4rem}
.cmp-card .savings{color:var(--green);font-size:.95rem;font-weight:700;margin-top:.5rem}
.cmp-card .link{display:inline-block;margin-top:.85rem}

.cmp-verdict{text-align:center;margin-top:1.5rem;padding:1.25rem;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:var(--radius-lg)}
.cmp-verdict .v-label{font-size:.7rem;color:var(--green);text-transform:uppercase;font-weight:700;letter-spacing:.5px;margin-bottom:.25rem}
.cmp-verdict .v-text{font-size:1.1rem;font-weight:800;color:var(--text)}
.cmp-verdict .v-save{font-size:.95rem;font-weight:700;color:var(--green);margin-top:.2rem}

@media(max-width:768px){
  .picker-row{grid-template-columns:1fr;gap:.75rem}
  .vs-circle{margin:0 auto}
  .cmp-grid{grid-template-columns:1fr}
}
</style>
{% endblock %}

{% block content %}
<div class="container">
  <div class="cmp-intro">
    <h1 class="section-title">⚖️ Comparer les prix</h1>
    <p class="section-sub">Choisissez un produit sur chaque site pour comparer</p>
  </div>

  <div class="picker-row">
    <!-- JUMIA PICKER -->
    <div class="picker">
      <div class="site-tag jumia">🟠 Jumia CI</div>
      <div class="search-box">
        <span class="icon">🔍</span>
        <input type="text" id="searchJumia" placeholder="Rechercher sur Jumia..." oninput="debounceSearch('jumia')" onfocus="showDrop('jumia')">
        <div class="dropdown" id="dropJumia"></div>
      </div>
      <div class="selected-card" id="selJumia">
        <img id="selJumiaImg" src="" alt="">
        <div class="info">
          <div class="name" id="selJumiaName"></div>
          <div class="cat" id="selJumiaCat"></div>
          <div class="price" id="selJumiaPrice"></div>
        </div>
        <div class="remove" onclick="clearPick('jumia')">&times;</div>
      </div>
    </div>

    <div class="vs-circle">VS</div>

    <!-- DJOKSTORE PICKER -->
    <div class="picker">
      <div class="site-tag djok">🟣 DjokStore CI</div>
      <div class="search-box">
        <span class="icon">🔍</span>
        <input type="text" id="searchDjok" placeholder="Rechercher sur DjokStore..." oninput="debounceSearch('djok')" onfocus="showDrop('djok')">
        <div class="dropdown" id="dropDjok"></div>
      </div>
      <div class="selected-card" id="selDjok">
        <img id="selDjokImg" src="" alt="">
        <div class="info">
          <div class="name" id="selDjokName"></div>
          <div class="cat" id="selDjokCat"></div>
          <div class="price" id="selDjokPrice"></div>
        </div>
        <div class="remove" onclick="clearPick('djok')">&times;</div>
      </div>
    </div>
  </div>

  <div class="cmp-btn-row">
    <button class="btn-jumia" onclick="doCompare()" style="padding:.85rem 2.5rem;font-size:1rem;border-radius:40px">⚖️ Comparer maintenant</button>
  </div>

  <div id="cmpResult"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
let picked={jumia:null,djok:null};
let timers={jumia:null,djok:null};

function debounceSearch(side){
  clearTimeout(timers[side]);
  timers[side]=setTimeout(()=>searchSide(side),300);
}

async function searchSide(side){
  const inputId=side==='jumia'?'searchJumia':'searchDjok';
  const dropId=side==='jumia'?'dropJumia':'dropDjok';
  const source=side==='jumia'?'jumia_ci':'djokstore_ci';
  const q=document.getElementById(inputId).value.trim();
  const drop=document.getElementById(dropId);
  if(q.length<2){drop.classList.remove('show');return}
  try{
    const r=await fetch(`${API}/search?q=${encodeURIComponent(q)}&source=${source}&per_page=15`);
    const d=await r.json();
    if(!d.products||!d.products.length){
      drop.innerHTML='<div class="empty">Aucun produit trouve pour "'+q+'"</div>';
      drop.classList.add('show');return;
    }
    drop.innerHTML=d.products.map(p=>`
      <div class="item${picked[side]&&picked[side].id===p.id?' selected':''}" onclick="pickProduct('${side}',${JSON.stringify(p).replace(/"/g,'&quot;')})">
        <img src="${p.image_url||''}" alt="" onerror="this.style.display='none'">
        <div class="info">
          <div class="name">${p.name}</div>
          <div class="price">${fmt(p.price)}</div>
          <div class="cat">${fCat(p.category)}</div>
        </div>
      </div>`).join('');
    drop.classList.add('show');
  }catch(e){console.error(e)}
}

function showDrop(side){
  const inputId=side==='jumia'?'searchJumia':'searchDjok';
  if(document.getElementById(inputId).value.trim().length>=2)searchSide(side);
}

function pickProduct(side,p){
  picked[side]=p;
  const pre=side==='jumia'?'selJumia':'selDjok';
  document.getElementById(pre).classList.add('show');
  document.getElementById(pre+'Img').src=p.image_url||'';
  document.getElementById(pre+'Name').textContent=p.name;
  document.getElementById(pre+'Cat').textContent=fCat(p.category);
  document.getElementById(pre+'Price').textContent=fmt(p.price);
  document.getElementById(side==='jumia'?'dropJumia':'dropDjok').classList.remove('show');
  document.getElementById(side==='jumia'?'searchJumia':'searchDjok').value='';
}

function clearPick(side){
  picked[side]=null;
  document.getElementById(side==='jumia'?'selJumia':'selDjok').classList.remove('show');
}

document.addEventListener('click',e=>{
  ['jumia','djok'].forEach(side=>{
    const picker=document.getElementById(side==='jumia'?'searchJumia':'searchDjok').closest('.picker');
    if(!picker.contains(e.target))document.getElementById(side==='jumia'?'dropJumia':'dropDjok').classList.remove('show');
  });
});

async function doCompare(){
  if(!picked.jumia||!picked.djok){toast('Selectionnez un produit sur chaque site','warning');return}
  const ids=picked.jumia.id+','+picked.djok.id;
  try{
    const r=await fetch(`${API}/products/compare?ids=${ids}`);
    if(!r.ok){const e=await r.json();toast(e.message||'Erreur','error');return}
    const d=await r.json();const best=d.best_deal.product_id;
    const diff=Math.abs(picked.jumia.price-picked.djok.price);

    document.getElementById('cmpResult').innerHTML='<div class="cmp-grid">'+d.comparison.map(p=>{
      const s=p.source||'jumia_ci',sl=s==='djokstore_ci'?'DjokStore':'Jumia',sc=s==='djokstore_ci'?'djok':'jumia';
      const isBest=p.id===best;
      return `<div class="cmp-card ${isBest?'best':''}">
        ${isBest?'<div class="best-tag">✅ Meilleur prix</div>':''}
        <span class="badge ${sc}">${sl}</span>
        <img src="${p.image_url||''}" alt="" onerror="this.style.display='none'">
        <div class="name">${p.name}</div>
        <div class="cat">${fCat(p.category)}</div>
        <div class="price gradient-text">${fmt(p.price)}</div>
        ${p.old_price?`<div class="old">${fmt(p.old_price)}</div>`:''}
        ${p.discount_pct?`<div class="disc">-${p.discount_pct}%</div>`:''}
        <a href="${p.product_url}" target="_blank" class="btn-ghost btn-sm link">Voir sur le site →</a>
      </div>`}).join('')+'</div>'+
      `<div class="cmp-verdict">
        <div class="v-label">Verdict</div>
        <div class="v-text">Le meilleur prix est sur <strong>${d.best_deal.product_id===picked.jumia.id?'Jumia CI':'DjokStore CI'}</strong></div>
        ${diff>0?`<div class="v-save">Vous economisez ${fmt(diff)}</div>`:'<div class="v-save">Meme prix sur les deux sites</div>'}
      </div>`;
    document.getElementById('cmpResult').scrollIntoView({behavior:'smooth',block:'start'});
  }catch(e){toast('Erreur','error')}
}
</script>
{% endblock %}
