{% extends "base.html" %}
{% block title %}Categories{% endblock %}
{% block extra_css %}
<style>
.cats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.25rem}
@media(max-width:1100px){.cats-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:768px){.cats-grid{grid-template-columns:repeat(2,1fr)}}
.cat-card{background:#fff;border-radius:var(--radius-lg);border:1px solid var(--border);overflow:hidden;transition:.3s;display:block}
.cat-card:hover{box-shadow:var(--shadow-xl);transform:translateY(-3px);border-color:var(--orange)}
.cat-card .bar{height:4px;background:linear-gradient(90deg,var(--orange),var(--purple))}
.cat-card .body{padding:1.25rem}
.cat-card h3{font-size:1.05rem;font-weight:700;margin-bottom:1rem;text-transform:capitalize;transition:.15s}
.cat-card:hover h3{color:var(--orange)}
.cat-row{display:flex;justify-content:space-between;padding:.4rem 0;font-size:.85rem}
.cat-row .label{color:var(--text2)}.cat-row .val{font-weight:700}
.cat-row .val.green{color:var(--green)}.cat-row .val.red{color:var(--red)}
.cat-card .foot{margin-top:.75rem;padding-top:.6rem;border-top:1px solid #f3f4f6;font-size:.78rem;font-weight:700;color:var(--orange);transition:transform .15s}
.cat-card:hover .foot{transform:translateX(3px)}
</style>
{% endblock %}

{% block content %}
<div class="container" style="max-width:100%;padding:1.5rem 2.5rem">
  <h1 class="section-title">📁 Categories</h1>
  <p class="section-sub">Explorer les produits par categorie</p>
  <div class="cats-grid" id="grid"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function init(){
  try{const d=await fetch(API+'/categories').then(r=>r.json());
  document.getElementById('grid').innerHTML=d.categories.map(c=>`
    <a href="/boutique?category=${c.category}" class="cat-card">
      <div class="bar"></div>
      <div class="body">
        <h3>${fCat(c.category)}</h3>
        <div class="cat-row"><span class="label">Produits</span><span class="val">${c.nb_products}</span></div>
        <div class="cat-row"><span class="label">Prix moyen</span><span class="val">${fmt(c.avg_price)}</span></div>
        <div class="cat-row"><span class="label">Min</span><span class="val green">${fmt(c.min_price)}</span></div>
        <div class="cat-row"><span class="label">Max</span><span class="val red">${fmt(c.max_price)}</span></div>
        <div class="foot">Voir les produits →</div>
      </div>
    </a>`).join('')}catch(e){toast('Erreur','error')}
}
init();
</script>
{% endblock %}
